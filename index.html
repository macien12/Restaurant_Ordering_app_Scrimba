<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Rubik+Spray+Paint&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&family=Rubik+Spray+Paint&display=swap" rel="stylesheet">
        <!-- Font Awesome -->
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/fontawesome.css" integrity="sha512-cOd3Jjo4vXG7cyt5/gEQgxwL6c7THvNQxSZphogpsFKsnbgeqEWa7Xsyf7zvDMpdmDAhiUUJGQPc5R3pocvnBQ==" crossorigin="anonymous" referrerpolicy="no-referrer">
    </head>
    <body>
	<script src="index.js" type="module"></script>
    <header>
        <div id="headerEl">
        <h1 class="displayFont white heading1">Bar Mleczny</h1>
        <h2 class="displayFont white heading2">Best Polish cuisine restaurant</h2>
        </div>
    </header>

    <main>
        <div id="menuContainer"></div>
    <div class="hidden" id="menuOrder">
        <h3 class="orderTitle">Your Order</h3>
        <div id="orderedItems"></div>
        <p class="hidden" id="discountMessage">
            🎉 15% discount applied!
        </p>
        <h3 class="priceEl">
            <span>Total Price:</span>
            <span>PLN <span id="totalPrice">0</span></span>
        </h3>
        <button class="completeBtn" data-order="orderData">Complete order</button>
    </div>

    <div class="hidden" id="orderCompleted" data-payment="paymentData">
        <h2>Thanks, <span id="payer-name"></span> Your order is on its way!</h2>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modalContent">
            <form class="paymentForm" id="paymentForm">
                <h3>Enter card details</h3>
                <input 
                type="text" 
                id="name" 
                placeholder="Enter your name" 
                class="inputEl" 
                required>
                <input 
                type="number" 
                id="cardNumber" 
                placeholder="Enter card number" 
                class="inputEl" 
                required>
                <input 
                type="number" 
                id="cvv" 
                placeholder="Enter CVV"
                minlength="3"
                maxlength="3" 
                required>
                <input 
                type="submit" 
                id="payButton"
                class="payButton inputEl" 
                value="Pay"
                data-pay="pay">
            </form>
        </div>
    </div>


    <div id="modalRate" class="modal-overlay hidden">
        <p class="rateMessage">Rate us!</p>
        <section class="stars">
            <i class="fa-regular fa-star"></i>
            <i class="fa-regular fa-star"></i>
            <i class="fa-regular fa-star"></i>
            <i class="fa-regular fa-star"></i>
        </section>
        <input type="text" placeholder="Rate us here!">
    </div>
    </main>

    </body>
</html>
