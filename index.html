<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Smythe&display=swap" rel="stylesheet">
        <!-- Font Awesome -->
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/fontawesome.css" integrity="sha512-cOd3Jjo4vXG7cyt5/gEQgxwL6c7THvNQxSZphogpsFKsnbgeqEWa7Xsyf7zvDMpdmDAhiUUJGQPc5R3pocvnBQ==" crossorigin="anonymous" referrerpolicy="no-referrer">
    </head>
    <body>
	<script src="index.js" type="module"></script>
    <header>
        <div id="headerEl">
        <h1 class="smytheFont white heading1">Jimmy's Dinner</h1>
        <h2 class="smytheFont white heading2">The best burgers and pizzas in town.</h2>
        </div>
    </header>

    <main>
        <div id="menuContainer"></div>
    <div class="hidden" id="menuOrder">
        <h3 class="orderTitle">Your Order</h3>
        <div id="orderedItems"></div>
        <h3 class="priceEl">
            <span>Total Price:</span>
            <span>$<span id="totalPrice">0</span></span>
        </h3>
        <button class="completeBtn" data-order="orderData">Complete order</button>
    </div>

    <div class="hidden" id="orderCompleted" data-payment="paymentData">
        <h2>Thanks, James! Your order is on its way!</h2>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modalContent" id="formEl">
            <form class="paymentForm">
                <h3>Enter card details</h3>
                <input 
                type="text" 
                id="name" 
                placeholder="Enter your name" 
                class="inputEl" 
                required>
                <input 
                type="number" 
                id="cardNumber" 
                placeholder="Enter card number" 
                class="inputEl" 
                required>
                <input 
                type="number" 
                id="cvv" 
                placeholder="Enter CVV"
                minlength="3"
                maxlength="3" 
                required>
                <input 
                type="submit" 
                id="payButton"
                class="payButton" 
                value="Pay" 
                class="inputEl">
            </form>
        </div>
    </div>
    </main>

    </body>
</html>
